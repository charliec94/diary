name: Test and publish Diary
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check application
        run: npm run build && npm test
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/charliec94/diary:latest
      - name: Test container and persistent mount
        run: sh scripts/test-container.sh
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/charliec94/diary:latest ghcr.io/charliec94/diary:sha-${GITHUB_SHA}
          docker push ghcr.io/charliec94/diary:sha-${GITHUB_SHA}
          docker push ghcr.io/charliec94/diary:latest
