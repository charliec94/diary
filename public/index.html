<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charlie — Life Journal</title>
  <meta name="description" content="A quiet place for your stories and memories.">
  <meta name="theme-color" content="#171918"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar"><button id="menu" class="icon-button" aria-label="Open journal navigation" aria-expanded="false" aria-controls="navigation">☰</button><a class="brand" href="#all">Charlie<span class="brand-divider">/</span><span id="breadcrumb">My journal</span></a></header>
    <details id="navigation" class="navigation"><summary class="sr-only">Journal navigation</summary><aside id="sidebar"><p class="nav-label">YOUR JOURNAL</p><nav aria-label="Journal navigation"><div id="main-nav"></div><details class="section-details"><summary>Life sections</summary><div id="section-nav"></div></details></nav><a class="export-link" href="/api/export" download>Export writing ↓</a></aside></details>
    <main id="main" tabindex="-1"><p class="muted" role="status">Opening your journal…</p></main>
  </div>
  <dialog id="editor">
    <form id="entry-form">
      <div class="editor-top"><span class="eyebrow" id="editor-label">New entry</span><button type="button" class="icon-button" id="close-editor" aria-label="Close editor">✕</button></div>
      <input id="entry-title" class="title-input" aria-label="Entry title" placeholder="Title" maxlength="200" required>
      <label class="sr-only" for="entry-content">Your story</label><textarea id="entry-content" placeholder="What’s on your mind?" maxlength="200000"></textarea>
      <div class="writing-meta"><span id="word-count">0 words</span></div>
      <details id="prompt-details" class="editor-disclosure"><summary>Writing prompts</summary><div id="editor-prompts" class="editor-prompts"></div></details>
      <details id="entry-details" class="editor-disclosure"><summary>Entry details</summary><div class="editor-fields"><label>Section<select id="entry-section"></select></label><label>Date<input id="entry-date" type="date" required></label><label>Life chapter<select id="entry-chapter"></select></label><label>Mood<select id="entry-mood"><option value="">Not set</option><option>Great</option><option>Good</option><option>Okay</option><option>Low</option><option>Difficult</option></select></label></div><label class="tags-label">Tags<input id="entry-tags" placeholder="People, places… (comma separated)" maxlength="300"></label><label class="favorite-check"><input type="checkbox" id="entry-favorite"> Keep as a favorite</label></details>
      <details id="memory-details" class="editor-disclosure"><summary>Attachments</summary><section class="attachment-section"><label class="upload-button" id="upload-label">＋ Add a memory<input type="file" id="upload" multiple accept=".jpg,.jpeg,.png,.webp,.gif,.mp3,.m4a,.wav,.ogg,.mp4,.webm,.weba,.pdf,.txt,.md"></label><p class="muted" id="upload-help">Save your entry first to add memories. Up to 25 MB each.</p><div id="attachments"></div></section></details>
      <p id="editor-error" role="alert"></p><div class="editor-bottom"><button type="button" class="danger-quiet" id="delete-entry" hidden>Delete</button><span id="save-status">Not saved yet</span><button class="primary" id="save-entry" type="submit">Save entry</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
